name: Build

on:
  push:
    paths-ignore:
      - README.md
      - docs/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**

permissions:
  actions: read
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every run publishes one artifact, Toolscreen-<version>-<commit>-unsigned:
#   Toolscreen-<version>-double-click-me-not-legal-for-speedruns.jar  universal JAR installer
#   Toolscreen-<version>-double-click-me-not-legal-for-speedruns.exe  universal EXE installer
#   x64/ and arm64/                                                    Toolscreen and liblogger DLLs and PDBs
# The jobs below each upload their share of that layout, and the last job merges the shares into the single artifact.

jobs:
  native:
    name: Build ${{ matrix.arch }} DLLs
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vs_arch: x64
            configure_preset: ci-ninja-x64
            build_preset: ci-release
            logger_name: liblogger_x64
            build_dir: out/build-ci
            artifact_dir: out/build-ci/bin/Release
            # The test runners only run on x64 hosts, so only this leg builds them.
            run_tests: true
            build_targets: Toolscreen toolscreen_gui_integration_tests toolscreen_interactive_create_tests toolscreen_game_state_source_tests toolscreen_path_sanitize_tests toolscreen_background_fit_layout_tests toolscreen_startup_lifecycle_tests toolscreen_expression_parser_tests toolscreen_base64_tests toolscreen_mirror_content_scan_tests
          - arch: arm64
            vs_arch: amd64_arm64
            configure_preset: ci-ninja-arm64
            build_preset: ci-release-arm64
            logger_name: liblogger_arm64
            build_dir: out/build-ci-arm64
            artifact_dir: out/build-ci-arm64/bin/Release
            run_tests: false
            build_targets: Toolscreen
    env:
      TOOLSCREEN_BUILD_DIR: ${{ matrix.build_dir }}
      TOOLSCREEN_ARTIFACT_DIR: ${{ matrix.artifact_dir }}
      TOOLSCREEN_BUNDLE_DIR: out/bundle
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite
      VCPKG_DISABLE_METRICS: '1'
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - parallel:
          - name: Set up MSVC developer command prompt
            uses: ilammy/msvc-dev-cmd@v1
            with:
              arch: ${{ matrix.vs_arch }}

          - name: Set up sccache
            uses: mozilla-actions/sccache-action@v0.0.9

          - name: Restore CMake dependency cache
            uses: actions/cache@v4
            with:
              path: |
                ${{ env.TOOLSCREEN_BUILD_DIR }}/_deps
                ${{ env.TOOLSCREEN_BUILD_DIR }}/downloads
              key: windows-${{ matrix.arch }}-build-deps-v4-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/vcpkg.json') }}
              restore-keys: |
                windows-${{ matrix.arch }}-build-deps-v4-

          - name: Restore vcpkg binary cache
            uses: actions/cache@v4
            with:
              path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
              key: windows-${{ matrix.arch }}-vcpkg-binary-v2-${{ hashFiles('src/vcpkg.json') }}
              restore-keys: |
                windows-${{ matrix.arch }}-vcpkg-binary-v2-

          - name: Restore prebuilt liblogger cache
            id: prebuilt_liblogger_cache
            uses: actions/cache@v4
            with:
              path: out/prebuilt-liblogger
              key: windows-${{ matrix.arch }}-prebuilt-liblogger-v2-${{ hashFiles('liblogger/LibLoggerVersion.cmake', 'scripts/fetch_signed_liblogger.ps1') }}
              restore-keys: |
                windows-${{ matrix.arch }}-prebuilt-liblogger-v2-

      - name: Fetch latest signed liblogger artifacts
        if: ${{ steps.prebuilt_liblogger_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path (Get-Location) 'out/prebuilt-liblogger'
          & .\scripts\fetch_signed_liblogger.ps1 -DestinationDirectory $destination -Architecture '${{ matrix.arch }}'

      - name: Configure native build
        shell: pwsh
        run: |
          $prebuiltLoggerDllPath = (Resolve-Path 'out/prebuilt-liblogger/${{ matrix.logger_name }}.dll').Path
          $prebuiltLoggerPdbPath = (Resolve-Path 'out/prebuilt-liblogger/${{ matrix.logger_name }}.pdb').Path

          cmake --preset ${{ matrix.configure_preset }} -DTOOLSCREEN_ENABLE_JAR_PACKAGING=OFF -DTOOLSCREEN_ENABLE_EXE_PACKAGING=OFF -DTOOLSCREEN_BUILD_DOWNLOADER_ARTIFACTS=OFF -DTOOLSCREEN_STAGE_LIBLOGGER_PDB=ON -DTOOLSCREEN_PREBUILT_LIBLOGGER_DLL_PATH="$prebuiltLoggerDllPath" -DTOOLSCREEN_PREBUILT_LIBLOGGER_PDB_PATH="$prebuiltLoggerPdbPath"

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel --target ${{ matrix.build_targets }}

      - name: Check native artifacts
        shell: pwsh
        run: ctest --preset ${{ matrix.build_preset }} --tests-regex "^(toolscreen_artifact_exists|liblogger_artifact_exists)$"

      - name: Run fast CTest smoke tests
        if: ${{ matrix.run_tests }}
        shell: pwsh
        run: ctest --preset ${{ matrix.build_preset }} --exclude-regex "^toolscreen_integration_"

      - name: Run GUI integration tests in parallel
        if: ${{ matrix.run_tests }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\$env:TOOLSCREEN_ARTIFACT_DIR\toolscreen_gui_integration_tests.exe" --run-groups-parallel

      - name: Stage DLLs and PDBs
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_ARTIFACT_DIR
          $stageDir = Join-Path $env:GITHUB_WORKSPACE "$env:TOOLSCREEN_BUNDLE_DIR/${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          foreach ($fileName in @('Toolscreen.dll', 'Toolscreen.pdb', '${{ matrix.logger_name }}.dll', '${{ matrix.logger_name }}.pdb')) {
            $sourcePath = Join-Path $sourceDir $fileName
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Expected native artifact not found: $sourcePath"
            }
            Copy-Item -LiteralPath $sourcePath -Destination $stageDir -Force
          }

      - name: Strip private symbols from Toolscreen.pdb
        shell: pwsh
        run: |
          $pdbPath = Join-Path $env:GITHUB_WORKSPACE "$env:TOOLSCREEN_BUNDLE_DIR/${{ matrix.arch }}/Toolscreen.pdb"

          $pdbCopyCommand = Get-Command pdbcopy.exe -ErrorAction SilentlyContinue
          $pdbCopyPath = if ($pdbCopyCommand) {
            $pdbCopyCommand.Path
          } else {
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter pdbcopy.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $pdbCopyPath) {
            Write-Warning 'pdbcopy.exe not found; keeping the full Toolscreen.pdb for this unsigned build.'
            return
          }

          $temporaryDirectory = Join-Path $env:RUNNER_TEMP 'toolscreen-pdbcopy'
          $strippedPdbPath = Join-Path $temporaryDirectory 'Toolscreen.pdb'
          New-Item -ItemType Directory -Force -Path $temporaryDirectory | Out-Null
          Remove-Item -Path $strippedPdbPath -Force -ErrorAction SilentlyContinue

          $beforeSizeBytes = (Get-Item $pdbPath).Length
          & $pdbCopyPath $pdbPath $strippedPdbPath -p

          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $strippedPdbPath)) {
            throw "Failed to strip private symbols from $pdbPath using $pdbCopyPath"
          }

          Move-Item -Path $strippedPdbPath -Destination $pdbPath -Force

          $afterSizeBytes = (Get-Item $pdbPath).Length
          Write-Host ('Reduced Toolscreen.pdb from {0} MiB to {1} MiB using PDBCopy.' -f [math]::Round($beforeSizeBytes / 1MB, 2), [math]::Round($afterSizeBytes / 1MB, 2))

      - name: Validate unsigned PE metadata
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\verify_unsigned_pe_metadata.ps1'
          & $scriptPath -ArtifactDirectory (Join-Path $env:GITHUB_WORKSPACE "$env:TOOLSCREEN_BUNDLE_DIR/${{ matrix.arch }}")

      - name: Mark DLLs and PDBs as unsigned
        shell: pwsh
        run: |
          Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "$env:TOOLSCREEN_BUNDLE_DIR/${{ matrix.arch }}") -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName ('{0}-not-legal-for-speedruns{1}' -f $_.BaseName, $_.Extension)
          }

      - name: Upload DLLs and PDBs
        uses: actions/upload-artifact@v4
        with:
          name: bundle-part-native-${{ matrix.arch }}
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.TOOLSCREEN_BUNDLE_DIR }}/

      - name: Show sccache stats
        if: ${{ always() }}
        shell: pwsh
        run: sccache --show-stats

  installers:
    name: Build installers
    needs: native
    runs-on: windows-latest
    env:
      TOOLSCREEN_PACKAGING_BUILD_DIR: out/build-ci-package
      TOOLSCREEN_PACKAGING_ARTIFACT_DIR: out/build-ci-package/bin/Release
      TOOLSCREEN_BUNDLE_DIR: out/bundle
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite
      VCPKG_DISABLE_METRICS: '1'
      SCCACHE_GHA_ENABLED: 'true'

    # Both installers are universal: each embeds the x64 and ARM64 DLLs, and the x64 EXE also runs on ARM64
    # Windows under emulation, where it injects the DLLs that match the game's JVM.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - parallel:
          - name: Download x64 DLLs
            uses: actions/download-artifact@v4
            with:
              name: bundle-part-native-x64
              path: out/native

          - name: Download ARM64 DLLs
            uses: actions/download-artifact@v4
            with:
              name: bundle-part-native-arm64
              path: out/native

          - name: Set up MSVC developer command prompt
            uses: ilammy/msvc-dev-cmd@v1
            with:
              arch: x64

          - name: Set up sccache
            uses: mozilla-actions/sccache-action@v0.0.9

          - name: Set up Java 17
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: '17'

          - name: Restore packaging CMake dependency cache
            uses: actions/cache@v4
            with:
              path: |
                ${{ env.TOOLSCREEN_PACKAGING_BUILD_DIR }}/_deps
                ${{ env.TOOLSCREEN_PACKAGING_BUILD_DIR }}/downloads
              key: windows-x64-package-deps-v2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/vcpkg.json') }}
              restore-keys: |
                windows-x64-package-deps-v2-

          - name: Restore vcpkg binary cache
            uses: actions/cache@v4
            with:
              path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
              key: windows-x64-vcpkg-binary-v2-${{ hashFiles('src/vcpkg.json') }}
              restore-keys: |
                windows-x64-vcpkg-binary-v2-

          - name: Restore Maven repository cache
            uses: actions/cache@v4
            with:
              path: ~/.m2/repository
              key: windows-maven-v2-${{ hashFiles('CMakeLists.txt') }}
              restore-keys: |
                windows-maven-v2-

      - name: Configure packaging build
        shell: pwsh
        run: |
          $x64DllPath = (Resolve-Path 'out/native/x64/Toolscreen-not-legal-for-speedruns.dll').Path
          $arm64DllPath = (Resolve-Path 'out/native/arm64/Toolscreen-not-legal-for-speedruns.dll').Path
          $x64LoggerPath = (Resolve-Path 'out/native/x64/liblogger_x64-not-legal-for-speedruns.dll').Path
          $arm64LoggerPath = (Resolve-Path 'out/native/arm64/liblogger_arm64-not-legal-for-speedruns.dll').Path

          cmake --preset ci-ninja-x64-packaging -DTOOLSCREEN_ENABLE_JAR_PACKAGING=ON -DTOOLSCREEN_ENABLE_EXE_PACKAGING=ON -DTOOLSCREEN_BUILD_DOWNLOADER_ARTIFACTS=OFF -DTOOLSCREEN_STAGE_LIBLOGGER_PDB=OFF -DTOOLSCREEN_PACKAGING_DLL_PATH="$x64DllPath" -DTOOLSCREEN_PACKAGING_LIBLOGGER_PATH="$x64LoggerPath" -DTOOLSCREEN_PACKAGING_X64_DLL_PATH="$x64DllPath" -DTOOLSCREEN_PACKAGING_ARM64_DLL_PATH="$arm64DllPath" -DTOOLSCREEN_PACKAGING_X64_LIBLOGGER_PATH="$x64LoggerPath" -DTOOLSCREEN_PACKAGING_ARM64_LIBLOGGER_PATH="$arm64LoggerPath"

      - name: Build installers
        shell: pwsh
        run: cmake --build --preset ci-package --parallel --target jar installer_exe

      - name: Check installer contents
        shell: pwsh
        run: ctest --test-dir $env:TOOLSCREEN_PACKAGING_BUILD_DIR --output-on-failure --tests-regex "^(toolscreen_jar_exists|toolscreen_exe_exists|toolscreen_exe_embeds_dll|toolscreen_exe_resources_readable)$"

      - name: Stage installers
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_PACKAGING_ARTIFACT_DIR
          $stageDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_BUNDLE_DIR
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          foreach ($pattern in 'Toolscreen-*-double-click-me.exe', 'Toolscreen-*-double-click-me.jar') {
            $found = @(Get-ChildItem -Path $sourceDir -File -Filter $pattern)
            if ($found.Count -ne 1) {
              throw "Expected exactly one file matching '$pattern' in $sourceDir, found $($found.Count)"
            }
            $file = $found[0]
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $stageDir ('{0}-not-legal-for-speedruns{1}' -f $file.BaseName, $file.Extension))
          }

          Get-ChildItem -Path $stageDir -File | ForEach-Object { Write-Host "Staged $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MiB)" }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bundle-part-installers
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.TOOLSCREEN_BUNDLE_DIR }}/

      - name: Show sccache stats
        if: ${{ always() }}
        shell: pwsh
        run: sccache --show-stats

  bundle:
    name: Bundle build artifact
    needs: [native, installers]
    runs-on: ubuntu-latest
    steps:
      - name: Check out version file
        uses: actions/checkout@v4
        with:
          sparse-checkout: ToolscreenVersion.cmake
          sparse-checkout-cone-mode: false

      - name: Name the artifact
        id: name
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $content = Get-Content -LiteralPath 'ToolscreenVersion.cmake' -Raw
          $parts = foreach ($component in 'MAJOR', 'MINOR', 'PATCH') {
            $match = [regex]::Match($content, "set\(TOOLSCREEN_VERSION_$component\s+(\d+)\)")
            if (-not $match.Success) { throw "Failed to parse TOOLSCREEN_VERSION_$component from ToolscreenVersion.cmake" }
            $match.Groups[1].Value
          }
          "artifact=Toolscreen-$($parts -join '.')-$($env:COMMIT_SHA.Substring(0, 7))-unsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Combines the three parts into one artifact and deletes the parts, so the run shows a single download.
      - name: Merge build artifact
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          pattern: bundle-part-*
          separate-directories: false
          delete-merged: true
          compression-level: 6
          retention-days: 7
