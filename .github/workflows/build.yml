name: Build

on:
  push:
    paths-ignore:
      - README.md
      - docs/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**

permissions:
  actions: read
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vs_arch: x64
            configure_preset: ci-ninja-x64
            build_preset: ci-release
            logger_name: liblogger_x64
            build_dir: out/build-ci
            artifact_dir: out/build-ci/bin/Release
            can_run: true
          - arch: arm64
            vs_arch: amd64_arm64
            configure_preset: ci-ninja-arm64
            build_preset: ci-release-arm64
            logger_name: liblogger_arm64
            build_dir: out/build-ci-arm64
            artifact_dir: out/build-ci-arm64/bin/Release
            can_run: false
    permissions:
      actions: read
      contents: read
    env:
      TOOLSCREEN_BUILD_DIR: ${{ matrix.build_dir }}
      TOOLSCREEN_ARTIFACT_DIR: ${{ matrix.artifact_dir }}
      TOOLSCREEN_RELEASE_DIR: out/release-unsigned
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite
      VCPKG_DISABLE_METRICS: '1'
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vs_arch }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Restore CMake dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TOOLSCREEN_BUILD_DIR }}/_deps
            ${{ env.TOOLSCREEN_BUILD_DIR }}/downloads
          key: windows-${{ matrix.arch }}-build-deps-v4-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/vcpkg.json') }}
          restore-keys: |
            windows-${{ matrix.arch }}-build-deps-v4-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: windows-${{ matrix.arch }}-vcpkg-binary-v2-${{ hashFiles('src/vcpkg.json') }}
          restore-keys: |
            windows-${{ matrix.arch }}-vcpkg-binary-v2-

      - name: Restore prebuilt liblogger cache
        id: prebuilt_liblogger_cache
        uses: actions/cache@v4
        with:
          path: out/prebuilt-liblogger
          key: windows-${{ matrix.arch }}-prebuilt-liblogger-v2-${{ hashFiles('liblogger/LibLoggerVersion.cmake', 'scripts/fetch_signed_liblogger.ps1') }}
          restore-keys: |
            windows-${{ matrix.arch }}-prebuilt-liblogger-v2-

      - name: Fetch latest signed liblogger artifacts
        if: ${{ steps.prebuilt_liblogger_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path (Get-Location) 'out/prebuilt-liblogger'
          & .\scripts\fetch_signed_liblogger.ps1 -DestinationDirectory $destination -Architecture '${{ matrix.arch }}'

      - name: Configure core build preset
        shell: pwsh
        run: |
          $prebuiltLoggerDllPath = (Resolve-Path 'out/prebuilt-liblogger/${{ matrix.logger_name }}.dll').Path

          cmake --preset ${{ matrix.configure_preset }} -DTOOLSCREEN_ENABLE_JAR_PACKAGING=OFF -DTOOLSCREEN_ENABLE_EXE_PACKAGING=OFF -DTOOLSCREEN_BUILD_DOWNLOADER_ARTIFACTS=OFF -DTOOLSCREEN_STAGE_LIBLOGGER_PDB=OFF -DTOOLSCREEN_PREBUILT_LIBLOGGER_DLL_PATH="$prebuiltLoggerDllPath"

      - name: Build DLLs and test runners
        shell: pwsh
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel --target Toolscreen toolscreen_gui_integration_tests toolscreen_interactive_create_tests toolscreen_game_state_source_tests toolscreen_path_sanitize_tests toolscreen_background_fit_layout_tests toolscreen_startup_lifecycle_tests toolscreen_expression_parser_tests toolscreen_base64_tests

      - name: Run fast CTest smoke tests
        if: ${{ matrix.can_run }}
        shell: pwsh
        run: ctest --preset ${{ matrix.build_preset }} --exclude-regex "^toolscreen_integration_"

      - name: Run GUI integration tests in parallel
        if: ${{ matrix.can_run }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\$env:TOOLSCREEN_ARTIFACT_DIR\toolscreen_gui_integration_tests.exe" --run-groups-parallel

      - name: Upload native payloads for universal packaging
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: toolscreen-${{ matrix.arch }}-packaging-inputs
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ env.TOOLSCREEN_ARTIFACT_DIR }}/Toolscreen.dll
            ${{ env.TOOLSCREEN_ARTIFACT_DIR }}/${{ matrix.logger_name }}.dll

      - name: Assemble unsigned native release inputs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_RELEASE_DIR
          $coreDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_ARTIFACT_DIR

          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          Copy-Item -Path (Join-Path $coreDir 'Toolscreen.dll') -Destination (Join-Path $releaseDir 'Toolscreen.dll') -Force
          Copy-Item -Path (Join-Path $coreDir 'Toolscreen.pdb') -Destination (Join-Path $releaseDir 'Toolscreen.pdb') -Force
          Copy-Item -Path (Join-Path $coreDir '${{ matrix.logger_name }}.dll') -Destination (Join-Path $releaseDir '${{ matrix.logger_name }}.dll') -Force

      - name: Strip private symbols from unsigned PDB
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_RELEASE_DIR
          $pdbPath = Join-Path $artifactDir 'Toolscreen.pdb'

          if (-not (Test-Path $pdbPath)) {
            throw "Expected unsigned Toolscreen PDB not found: $pdbPath"
          }

          $pdbCopyCommand = Get-Command pdbcopy.exe -ErrorAction SilentlyContinue
          $pdbCopyPath = if ($pdbCopyCommand) {
            $pdbCopyCommand.Path
          } else {
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter pdbcopy.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $pdbCopyPath) {
            Write-Warning 'pdbcopy.exe not found; keeping the full Toolscreen.pdb for this unsigned build.'
            return
          }

          $temporaryDirectory = Join-Path $env:RUNNER_TEMP 'toolscreen-pdbcopy'
          $strippedPdbPath = Join-Path $temporaryDirectory 'Toolscreen.pdb'
          New-Item -ItemType Directory -Force -Path $temporaryDirectory | Out-Null
          Remove-Item -Path $strippedPdbPath -Force -ErrorAction SilentlyContinue

          $beforeSizeBytes = (Get-Item $pdbPath).Length
          & $pdbCopyPath $pdbPath $strippedPdbPath -p

          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $strippedPdbPath)) {
            throw "Failed to strip private symbols from $pdbPath using $pdbCopyPath"
          }

          Remove-Item -Path $pdbPath -Force
          Move-Item -Path $strippedPdbPath -Destination $pdbPath

          $afterSizeBytes = (Get-Item $pdbPath).Length
          Write-Host ('Reduced Toolscreen.pdb from {0} MiB to {1} MiB using PDBCopy.' -f [math]::Round($beforeSizeBytes / 1MB, 2), [math]::Round($afterSizeBytes / 1MB, 2))

      - name: Validate unsigned PE metadata
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\verify_unsigned_pe_metadata.ps1'
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_RELEASE_DIR
          & $scriptPath -ArtifactDirectory $artifactDirectory

      - name: Rename native release artifacts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_RELEASE_DIR
          $suffix = '-not-legal-for-speedruns'
          $filesToRename = @(
            Join-Path $outputDir 'Toolscreen.dll'
            Join-Path $outputDir 'Toolscreen.pdb'
            Join-Path $outputDir '${{ matrix.logger_name }}.dll'
          )

          foreach ($filePath in $filesToRename) {
            if (-not (Test-Path $filePath)) {
              throw "Expected artifact not found: $filePath"
            }

            $item = Get-Item $filePath
            $renamed = '{0}{1}{2}' -f $item.BaseName, $suffix, $item.Extension
            Move-Item -Path $item.FullName -Destination (Join-Path $item.DirectoryName $renamed)
          }

      - name: Upload unsigned native release inputs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: toolscreen-${{ matrix.arch }}-unsigned-release-inputs
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ env.TOOLSCREEN_RELEASE_DIR }}/Toolscreen-not-legal-for-speedruns.dll
            ${{ env.TOOLSCREEN_RELEASE_DIR }}/Toolscreen-not-legal-for-speedruns.pdb
            ${{ env.TOOLSCREEN_RELEASE_DIR }}/${{ matrix.logger_name }}-not-legal-for-speedruns.dll

      - name: Show sccache stats
        if: ${{ always() }}
        shell: pwsh
        run: sccache --show-stats

  package_universal:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build_core
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    env:
      TOOLSCREEN_PACKAGING_BUILD_DIR: out/build-ci-package
      TOOLSCREEN_PACKAGING_ARTIFACT_DIR: out/build-ci-package/bin/Release
      TOOLSCREEN_RELEASE_DIR: out/release-unsigned-universal
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite
      VCPKG_DISABLE_METRICS: '1'
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download x64 packaging inputs
        uses: actions/download-artifact@v4
        with:
          name: toolscreen-x64-packaging-inputs
          path: out/packaging-inputs/x64

      - name: Download ARM64 packaging inputs
        uses: actions/download-artifact@v4
        with:
          name: toolscreen-arm64-packaging-inputs
          path: out/packaging-inputs/arm64

      - name: Download x64 native release inputs
        uses: actions/download-artifact@v4
        with:
          name: toolscreen-x64-unsigned-release-inputs
          path: out/release-bundles/x64

      - name: Download ARM64 native release inputs
        uses: actions/download-artifact@v4
        with:
          name: toolscreen-arm64-unsigned-release-inputs
          path: out/release-bundles/arm64

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore packaging CMake dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TOOLSCREEN_PACKAGING_BUILD_DIR }}/_deps
            ${{ env.TOOLSCREEN_PACKAGING_BUILD_DIR }}/downloads
          key: windows-universal-package-deps-v1-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/vcpkg.json') }}
          restore-keys: |
            windows-universal-package-deps-v1-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: windows-x64-vcpkg-binary-v2-${{ hashFiles('src/vcpkg.json') }}
          restore-keys: |
            windows-x64-vcpkg-binary-v2-

      - name: Restore Maven repository cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: windows-maven-v2-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            windows-maven-v2-

      - name: Configure universal packaging build
        shell: pwsh
        run: |
          $x64DllPath = (Resolve-Path 'out/packaging-inputs/x64/Toolscreen.dll').Path
          $arm64DllPath = (Resolve-Path 'out/packaging-inputs/arm64/Toolscreen.dll').Path
          $x64LoggerPath = (Resolve-Path 'out/packaging-inputs/x64/liblogger_x64.dll').Path
          $arm64LoggerPath = (Resolve-Path 'out/packaging-inputs/arm64/liblogger_arm64.dll').Path

          cmake --preset ci-ninja-x64-packaging -DTOOLSCREEN_ENABLE_JAR_PACKAGING=ON -DTOOLSCREEN_ENABLE_EXE_PACKAGING=OFF -DTOOLSCREEN_BUILD_DOWNLOADER_ARTIFACTS=OFF -DTOOLSCREEN_STAGE_LIBLOGGER_PDB=OFF -DTOOLSCREEN_PACKAGING_DLL_PATH="$x64DllPath" -DTOOLSCREEN_PACKAGING_LIBLOGGER_PATH="$x64LoggerPath" -DTOOLSCREEN_PACKAGING_X64_DLL_PATH="$x64DllPath" -DTOOLSCREEN_PACKAGING_ARM64_DLL_PATH="$arm64DllPath" -DTOOLSCREEN_PACKAGING_X64_LIBLOGGER_PATH="$x64LoggerPath" -DTOOLSCREEN_PACKAGING_ARM64_LIBLOGGER_PATH="$arm64LoggerPath"

      - name: Build universal JAR package
        shell: pwsh
        run: cmake --build --preset ci-package --parallel --target jar

      - name: Validate universal JAR contents
        shell: pwsh
        run: ctest --test-dir $env:TOOLSCREEN_PACKAGING_BUILD_DIR --output-on-failure -R "^toolscreen_jar_exists$"

      - name: Assemble unsigned universal release input
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_RELEASE_DIR
          $jarDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_PACKAGING_ARTIFACT_DIR
          $jarMatches = Get-ChildItem -Path $jarDir -File -Filter 'Toolscreen-*-double-click-me.jar'

          if ($jarMatches.Count -ne 1) {
            throw "Expected exactly one packaged Toolscreen jar in $jarDir, found $($jarMatches.Count)"
          }

          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Path $jarMatches[0].FullName -Destination (Join-Path $releaseDir $jarMatches[0].Name) -Force

      - name: Rename universal release artifact
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE $env:TOOLSCREEN_RELEASE_DIR
          $jarMatches = Get-ChildItem -Path $outputDir -File -Filter 'Toolscreen-*-double-click-me.jar'

          if ($jarMatches.Count -ne 1) {
            throw "Expected exactly one universal Toolscreen jar in $outputDir, found $($jarMatches.Count)"
          }

          $jar = $jarMatches[0]
          $renamed = '{0}-not-legal-for-speedruns{1}' -f $jar.BaseName, $jar.Extension
          Move-Item -Path $jar.FullName -Destination (Join-Path $jar.DirectoryName $renamed)

      - name: Add universal JAR to per-architecture release bundles
        shell: pwsh
        run: |
          $jarMatches = Get-ChildItem -Path $env:TOOLSCREEN_RELEASE_DIR -File -Filter 'Toolscreen-*-double-click-me-not-legal-for-speedruns.jar'
          if ($jarMatches.Count -ne 1) {
            throw "Expected exactly one renamed universal Toolscreen jar, found $($jarMatches.Count)"
          }

          $bundleSpecs = @(
            @{ Architecture = 'x64'; Logger = 'liblogger_x64-not-legal-for-speedruns.dll' }
            @{ Architecture = 'arm64'; Logger = 'liblogger_arm64-not-legal-for-speedruns.dll' }
          )

          foreach ($bundleSpec in $bundleSpecs) {
            $bundleDir = Join-Path 'out/release-bundles' $bundleSpec.Architecture
            Copy-Item -Path $jarMatches[0].FullName -Destination (Join-Path $bundleDir $jarMatches[0].Name) -Force

            $expectedFiles = @(
              'Toolscreen-not-legal-for-speedruns.dll'
              'Toolscreen-not-legal-for-speedruns.pdb'
              $bundleSpec.Logger
              $jarMatches[0].Name
            )

            foreach ($expectedFile in $expectedFiles) {
              $expectedPath = Join-Path $bundleDir $expectedFile
              if (-not (Test-Path $expectedPath -PathType Leaf)) {
                throw "Expected release artifact not found: $expectedPath"
              }
            }

            $actualFiles = Get-ChildItem -Path $bundleDir -File
            if ($actualFiles.Count -ne $expectedFiles.Count) {
              throw "Expected exactly $($expectedFiles.Count) files in $bundleDir, found $($actualFiles.Count)"
            }
          }

      - name: Upload unsigned x64 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toolscreen-x64-unsigned-artifacts
          compression-level: 6
          if-no-files-found: error
          retention-days: 7
          path: |
            out/release-bundles/x64/Toolscreen-not-legal-for-speedruns.dll
            out/release-bundles/x64/Toolscreen-not-legal-for-speedruns.pdb
            out/release-bundles/x64/liblogger_x64-not-legal-for-speedruns.dll
            out/release-bundles/x64/Toolscreen-*-double-click-me-not-legal-for-speedruns.jar

      - name: Upload unsigned ARM64 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toolscreen-arm64-unsigned-artifacts
          compression-level: 6
          if-no-files-found: error
          retention-days: 7
          path: |
            out/release-bundles/arm64/Toolscreen-not-legal-for-speedruns.dll
            out/release-bundles/arm64/Toolscreen-not-legal-for-speedruns.pdb
            out/release-bundles/arm64/liblogger_arm64-not-legal-for-speedruns.dll
            out/release-bundles/arm64/Toolscreen-*-double-click-me-not-legal-for-speedruns.jar

      - name: Show sccache stats
        if: ${{ always() }}
        shell: pwsh
        run: sccache --show-stats
